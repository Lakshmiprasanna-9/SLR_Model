
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Height Weight Predictor</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 30px;
        }

        /* Main white box */
        .container {
            background: white;
            width: 100%;
            max-width: 650px;
            min-height: 600px;
            padding: 55px 60px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .icon {
            font-size: 60px;
            text-align: center;
            margin-bottom: 18px;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 34px;
            margin-bottom: 15px;
        }

        /* Boy and girl emojis */
        .people {
            text-align: center;
            font-size: 55px;
            margin: 15px 0 25px;
            letter-spacing: 20px;
        }

        .description {
            text-align: center;
            color: #777;
            font-size: 16px;
            margin-bottom: 40px;
            line-height: 1.7;
        }

        label {
            display: block;
            font-weight: 600;
            color: #444;
            font-size: 17px;
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            padding: 18px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 17px;
            outline: none;
            transition: 0.3s;
            margin-bottom: 28px;
        }

        input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 7px rgba(118, 75, 162, 0.3);
        }

        button {
            width: 100%;
            padding: 19px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 19px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(118, 75, 162, 0.3);
        }

        .result {
            margin-top: 30px;
            padding: 23px;
            background: #f0edff;
            border-left: 5px solid #764ba2;
            border-radius: 12px;
            text-align: center;
            color: #5c3b91;
            font-size: 21px;
            font-weight: 600;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            color: #999;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 25px;
                min-height: auto;
            }

            h1 {
                font-size: 27px;
            }

            .people {
                font-size: 45px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="icon">📏</div>

        <h1>Height & Weight Predictor</h1>

        <div class="people">
            👦🏻 👧🏻
        </div>

        <p class="description">
            Welcome to our Height & Weight Prediction System!
            Enter your height below and let our
            Machine Learning model predict your weight.
        </p>

        <form action="/predict" method="POST">

            <label for="height">
                Enter Your Height
            </label>

            <input
                type="number"
                id="height"
                name="height"
                placeholder="Enter your height"
                step="any"
                required
            >

            <button type="submit">
                Predict Weight ✨
            </button>

        </form>

        {% if prediction_text %}

            <div class="result">
                🎯 {{ prediction_text }}
            </div>

        {% endif %}

        <div class="footer">
            Powered by Flask & Linear Regression ❤️
        </div>

    </div>

</body>

</html>
